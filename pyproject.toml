# Tool configuration only; dependencies are in requirements*.txt.

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes (unused imports, undefined names), I: import order,
# B: likely bugs (mutable defaults, loop variables in closures), UP: outdated syntax for py310.
select = ["E", "W", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
# Keep `from x import A as B, c` on one line, so a trailing `# noqa` covers the whole import.
combine-as-imports = true
